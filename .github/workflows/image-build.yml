name: Image Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-database:
    name: Build Documentation Database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Build database using amd64 builder
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        context: .
        platforms: linux/amd64
        target: db-builder
        outputs: type=local,dest=./build-output
        cache-from: type=gha,scope=db-builder
        cache-to: type=gha,mode=max,scope=db-builder
        secrets: |
          github_token=${{ secrets.GITHUB_TOKEN }}

    - name: Upload database artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: prebuilt-database
        path: ./build-output/app/.cache
        retention-days: 1
        overwrite: true
        include-hidden-files: true

  build:
    name: Build Multi-Platform Docker Image
    runs-on: ubuntu-latest
    needs: build-database
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Download database artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: prebuilt-database
        path: ./prebuilt-data

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Build multi-platform Docker image with pre-built database
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        context: .
        build-contexts: |
          prebuilt-data=./prebuilt-data
        target: runner-prebuilt
        platforms: linux/amd64,linux/arm64
        push: false
        cache-from: type=gha,scope=multi-platform
        cache-to: type=gha,mode=max,scope=multi-platform
        tags: mcp-optimizer:latest
