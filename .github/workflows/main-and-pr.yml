# These workflows run on every push to the main branch
name: Main Branch Checks
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

# Cancel superseded PR runs; never cancel runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code_checks:
    name: Code Checks
    uses: ./.github/workflows/code-checks.yml
